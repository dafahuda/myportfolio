<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="SIMPEG Dashboard mockup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1A1815"/>
      <stop offset="1" stop-color="#242019"/>
    </linearGradient>
    <style>
      .ink{fill:#0B0B0B}
      .muted{fill:#6B6B66}
      .line{stroke:#D9D7CF;stroke-width:1;fill:none}
      .surface{fill:#FFFFFF;stroke:#D9D7CF;stroke-width:1}
      .accent{fill:#C64F2E}
      .accent-soft{fill:#C64F2E;opacity:0.12}
      .ok{fill:#2E7D5B}
      .ok-soft{fill:#2E7D5B;opacity:0.14}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
      .sans{font-family:'Instrument Sans',ui-sans-serif,system-ui,sans-serif}
      .disp{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-weight:800}
    </style>
  </defs>

  <!-- backdrop -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- browser chrome -->
  <rect x="40" y="30" width="720" height="440" rx="10" class="surface"/>
  <rect x="40" y="30" width="720" height="34" rx="10" fill="#221E19"/>
  <rect x="40" y="60" width="720" height="1" fill="#3B362E"/>
  <circle cx="60" cy="47" r="4" fill="#E06C5A"/>
  <circle cx="76" cy="47" r="4" fill="#E5B454"/>
  <circle cx="92" cy="47" r="4" fill="#7DAE7A"/>
  <rect x="120" y="38" width="360" height="18" rx="4" fill="#262119"/>
  <text x="132" y="51" class="sans" font-size="11" fill="#A39E93">simpeg.badanbahasa.go.id / dashboard</text>

  <!-- sidebar -->
  <rect x="40" y="61" width="180" height="409" fill="#1E1B17"/>
  <rect x="40" y="61" width="180" height="1" fill="#3B362E"/>
  <rect x="220" y="61" width="1" height="409" fill="#3B362E"/>

  <text x="60" y="94" class="disp ink" font-size="18">SIMPEG</text>
  <text x="60" y="110" class="sans muted" font-size="10">Badan Bahasa</text>

  <!-- nav items -->
  <rect x="52" y="130" width="156" height="30" rx="6" class="accent-soft"/>
  <circle cx="66" cy="145" r="3" class="accent"/>
  <text x="78" y="149" class="sans ink" font-size="12">Dashboard</text>

  <g class="sans" font-size="12" fill="#F2F1EC">
    <text x="78" y="182">Pegawai</text>
    <text x="78" y="209">Pendidikan</text>
    <text x="78" y="236">Jabatan</text>
    <text x="78" y="263">Pangkat</text>
    <text x="78" y="290">Pelatihan</text>
    <text x="78" y="317">Dokumen</text>
    <text x="78" y="344">Laporan</text>
  </g>

  <line x1="52" y1="365" x2="208" y2="365" class="line"/>
  <text x="78" y="386" class="sans muted" font-size="11">Pengaturan</text>
  <text x="78" y="408" class="sans muted" font-size="11">Keluar</text>

  <!-- main header -->
  <text x="244" y="94" class="disp ink" font-size="22">Ringkasan Pegawai</text>
  <text x="244" y="112" class="sans muted" font-size="11">Data periode aktif · diperbarui hari ini</text>

  <!-- top action -->
  <rect x="640" y="80" width="100" height="30" rx="6" fill="#F2F1EC"/>
  <text x="656" y="99" class="sans" font-size="11" fill="#1A1815">+ Tambah Data</text>

  <!-- KPI cards -->
  <g>
    <rect x="244" y="130" width="160" height="82" rx="8" class="surface"/>
    <text x="256" y="150" class="sans muted" font-size="10">TOTAL PEGAWAI</text>
    <text x="256" y="184" class="disp ink" font-size="30">1.284</text>
    <rect x="256" y="192" width="42" height="14" rx="3" class="ok-soft"/>
    <text x="262" y="203" class="sans ok" font-size="9">+3.2%</text>

    <rect x="416" y="130" width="160" height="82" rx="8" class="surface"/>
    <text x="428" y="150" class="sans muted" font-size="10">AKTIF BULAN INI</text>
    <text x="428" y="184" class="disp ink" font-size="30">1.207</text>
    <rect x="428" y="192" width="42" height="14" rx="3" class="ok-soft"/>
    <text x="434" y="203" class="sans ok" font-size="9">+0.8%</text>

    <rect x="588" y="130" width="152" height="82" rx="8" class="surface"/>
    <text x="600" y="150" class="sans muted" font-size="10">PELATIHAN Q2</text>
    <text x="600" y="184" class="disp ink" font-size="30">312</text>
    <rect x="600" y="192" width="52" height="14" rx="3" class="accent-soft"/>
    <text x="606" y="203" class="sans accent" font-size="9">24 baru</text>
  </g>

  <!-- chart card -->
  <rect x="244" y="226" width="332" height="230" rx="8" class="surface"/>
  <text x="258" y="248" class="sans ink" font-size="12" font-weight="600">Distribusi Golongan</text>
  <text x="258" y="262" class="sans muted" font-size="10">Enam bulan terakhir</text>

  <!-- bars -->
  <g>
    <rect x="266" y="360" width="28" height="70" class="ink" opacity="0.85"/>
    <rect x="306" y="330" width="28" height="100" class="ink"/>
    <rect x="346" y="300" width="28" height="130" class="accent"/>
    <rect x="386" y="340" width="28" height="90" class="ink" opacity="0.75"/>
    <rect x="426" y="320" width="28" height="110" class="ink" opacity="0.9"/>
    <rect x="466" y="360" width="28" height="70" class="ink" opacity="0.6"/>
    <rect x="506" y="380" width="28" height="50" class="ink" opacity="0.5"/>
    <line x1="258" y1="432" x2="562" y2="432" class="line"/>
  </g>
  <g class="sans muted" font-size="9">
    <text x="272" y="445">I</text>
    <text x="311" y="445">II</text>
    <text x="349" y="445">III</text>
    <text x="391" y="445">IV</text>
    <text x="431" y="445">V</text>
    <text x="471" y="445">VI</text>
    <text x="511" y="445">VII</text>
  </g>

  <!-- table card -->
  <rect x="588" y="226" width="152" height="230" rx="8" class="surface"/>
  <text x="600" y="248" class="sans ink" font-size="12" font-weight="600">Aktivitas</text>
  <text x="600" y="262" class="sans muted" font-size="10">Log terbaru</text>

  <g class="sans" font-size="10">
    <circle cx="608" cy="286" r="3" class="accent"/>
    <text x="618" y="290" fill="#F2F1EC">CRUD · Pegawai</text>
    <text x="618" y="302" class="muted" font-size="9">10 menit lalu</text>

    <circle cx="608" cy="326" r="3" fill="#2E7D5B"/>
    <text x="618" y="330" fill="#F2F1EC">Import Sheets</text>
    <text x="618" y="342" class="muted" font-size="9">32 menit lalu</text>

    <circle cx="608" cy="366" r="3" fill="#A39E93"/>
    <text x="618" y="370" fill="#F2F1EC">Autocrat run</text>
    <text x="618" y="382" class="muted" font-size="9">1 jam lalu</text>

    <circle cx="608" cy="406" r="3" fill="#A39E93"/>
    <text x="618" y="410" fill="#F2F1EC">Form input</text>
    <text x="618" y="422" class="muted" font-size="9">2 jam lalu</text>
  </g>
</svg>
