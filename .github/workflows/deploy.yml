name: Deploy to VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Secret disimpan di Settings -> Secrets and variables -> Actions,
      # dengan nama DEPLOY_SECRET. JANGAN pernah menuliskan nilainya di
      # dalam berkas ini: repo ini publik.
      - name: Trigger VPS deploy
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          if [ -z "$DEPLOY_SECRET" ]; then
            echo "::error::Secret DEPLOY_SECRET belum diisi untuk repo ini."
            exit 1
          fi

          code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
            -X POST "https://portfolio.dhr.my.id/webhook/deploy?secret=$DEPLOY_SECRET")

          echo "HTTP $code"
          cat /tmp/resp.json || true

          if [ "$code" != "200" ]; then
            echo "::error::Deploy gagal (HTTP $code)."
            exit 1
          fi
